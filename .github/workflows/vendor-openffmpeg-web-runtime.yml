name: Verify OpenFFmpeg Web Runtime

on:
  push:
    paths:
      - '.github/workflows/vendor-openffmpeg-web-runtime.yml'
      - 'docs/vendor/ffmpeg/**'
      - 'docs/smoke-test.html'
      - 'docs/smoke-test.js'
  pull_request:
    paths:
      - '.github/workflows/vendor-openffmpeg-web-runtime.yml'
      - 'docs/vendor/ffmpeg/**'
      - 'docs/smoke-test.html'
      - 'docs/smoke-test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out Slot-6
        uses: actions/checkout@v4

      - name: Verify bundled ffmpeg.wasm runtime
        shell: bash
        run: |
          set -euo pipefail

          runtime='docs/vendor/ffmpeg'
          required=(
            ffmpeg.js
            814.ffmpeg.js
            ffmpeg-core.js
            ffmpeg-core.wasm
            VERSIONS.txt
          )

          for file in "${required[@]}"; do
            if [[ ! -s "$runtime/$file" ]]; then
              echo "Missing or empty runtime file: $runtime/$file" >&2
              exit 1
            fi
          done

          grep -Fxq 'ffmpeg wrapper: 0.12.15' "$runtime/VERSIONS.txt"
          grep -Fxq 'ffmpeg core: 0.12.10' "$runtime/VERSIONS.txt"

          wasm_size=$(stat -c%s "$runtime/ffmpeg-core.wasm")
          if (( wasm_size < 10000000 )); then
            echo "ffmpeg-core.wasm is unexpectedly small: ${wasm_size} bytes" >&2
            exit 1
          fi

          echo "Bundled OpenFFmpeg runtime is present and pinned."
          cat "$runtime/VERSIONS.txt"
          echo "ffmpeg-core.wasm size: ${wasm_size} bytes"

      - name: Locate headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser=$(command -v "$candidate")
              break
            fi
          done
          if [[ -z "$browser" ]]; then
            echo 'No supported Chrome/Chromium executable is installed on this runner.' >&2
            exit 1
          fi
          echo "BROWSER=$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - name: Encode a real MP4 in headless Chrome
        shell: bash
        run: |
          set -euo pipefail

          python3 -m http.server 8000 --directory docs >/tmp/openffmpeg-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/smoke-test.html >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8000/smoke-test.html >/dev/null

          set +e
          html=$(
            "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=90000 \
              --dump-dom \
              http://127.0.0.1:8000/smoke-test.html \
              2>/tmp/openffmpeg-chrome.log
          )
          chrome_rc=$?
          set -e

          printf '%s\n' "$html"
          if (( chrome_rc != 0 )) || ! grep -q 'data-result="pass"' <<<"$html"; then
            echo 'Browser FFmpeg smoke test failed.' >&2
            echo '--- Chrome log ---' >&2
            cat /tmp/openffmpeg-chrome.log >&2 || true
            echo '--- HTTP server log ---' >&2
            cat /tmp/openffmpeg-http.log >&2 || true
            exit 1
          fi

          grep -o 'PASS: FFmpeg loaded and encoded a valid MP4 ([^<]*' <<<"$html" || true
          echo 'Real browser FFmpeg encode smoke test passed.'

name: Verify OpenFFmpeg Web Runtime

on:
  push:
    paths:
      - '.github/workflows/vendor-openffmpeg-web-runtime.yml'
      - 'docs/vendor/ffmpeg/**'
      - 'docs/smoke-test.html'
      - 'docs/smoke-test.js'
  pull_request:
    paths:
      - '.github/workflows/vendor-openffmpeg-web-runtime.yml'
      - 'docs/vendor/ffmpeg/**'
      - 'docs/smoke-test.html'
      - 'docs/smoke-test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out Slot-6
        uses: actions/checkout@v4

      - name: Verify bundled ffmpeg.wasm runtime
        shell: bash
        run: |
          set -euo pipefail

          runtime='docs/vendor/ffmpeg'
          required=(
            ffmpeg.js
            814.ffmpeg.js
            ffmpeg-core.js
            ffmpeg-core.wasm
            VERSIONS.txt
          )

          for file in "${required[@]}"; do
            if [[ ! -s "$runtime/$file" ]]; then
              echo "Missing or empty runtime file: $runtime/$file" >&2
              exit 1
            fi
          done

          grep -Fxq 'ffmpeg wrapper: 0.12.15' "$runtime/VERSIONS.txt"
          grep -Fxq 'ffmpeg core: 0.12.10' "$runtime/VERSIONS.txt"

          wasm_size=$(stat -c%s "$runtime/ffmpeg-core.wasm")
          if (( wasm_size < 10000000 )); then
            echo "ffmpeg-core.wasm is unexpectedly small: ${wasm_size} bytes" >&2
            exit 1
          fi

          echo "Bundled OpenFFmpeg runtime is present and pinned."
          cat "$runtime/VERSIONS.txt"
          echo "ffmpeg-core.wasm size: ${wasm_size} bytes"

      - name: Locate headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser=$(command -v "$candidate")
              break
            fi
          done
          if [[ -z "$browser" ]]; then
            echo 'No supported Chrome/Chromium executable is installed on this runner.' >&2
            exit 1
          fi
          echo "BROWSER=$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - name: Install lightweight Chrome controller
        shell: bash
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Encode a real MP4 in headless Chrome
        shell: bash
        run: |
          set -euo pipefail

          python3 -m http.server 8000 --directory docs >/tmp/openffmpeg-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/smoke-test.html >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8000/smoke-test.html >/dev/null

          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';

          const browser=await puppeteer.launch({
            executablePath: process.env.BROWSER,
            headless: true,
            args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage']
          });

          try{
            const page=await browser.newPage();
            page.on('console',msg=>console.log(`[browser:${msg.type()}] ${msg.text()}`));
            page.on('pageerror',err=>console.error(`[browser:pageerror] ${err.stack||err}`));
            page.on('requestfailed',request=>console.error(`[browser:requestfailed] ${request.url()} ${request.failure()?.errorText||''}`));

            await page.goto('http://127.0.0.1:8000/smoke-test.html',{waitUntil:'networkidle0',timeout:30000});
            await page.waitForFunction(
              ()=>document.body.dataset.result==='pass'||document.body.dataset.result==='fail',
              {timeout:90000}
            );

            const result=await page.evaluate(()=>({
              state:document.body.dataset.result,
              status:document.getElementById('status')?.textContent||''
            }));
            console.log(`Smoke result: ${result.state}`);
            console.log(result.status);
            if(result.state!=='pass')process.exitCode=1;
          }finally{
            await browser.close();
          }
          NODE

          echo '--- HTTP requests ---'
          cat /tmp/openffmpeg-http.log || true
          echo 'Real browser FFmpeg encode smoke test passed.'

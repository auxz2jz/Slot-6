name: Build Android FFmpeg Native Engine
on:
  push:
    branches: [ android-native-build ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK r29
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
      - name: Build FFmpeg CLI shared library
        env:
          API: 26
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          bash android-native/build_ffmpeg_android.sh "${{ matrix.abi }}"
      - name: Upload native engine
        uses: actions/upload-artifact@v4
        with:
          name: openffmpeg-native-${{ matrix.abi }}
          path: android-native/output/${{ matrix.abi }}
          if-no-files-found: error
